name: Build Windows (MSVC + CUDA)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_TARGET_TRIPLET: x64-windows
  CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.4"
  BUILD_DIR: build-windows
  VCPKG_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

jobs:
  build:
    # windows-2025 теперь предоставляет Visual Studio 2026 (VS 18.x)
    # Это необходимо для совместимости с CUDA 13.4 и решения ошибки C2326
    runs-on: windows-2025
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSVC (Visual Studio 2026)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # Явно запрашиваем VS 2026 (версия 18.0), чтобы не зависеть от дефолта образа
          vsversion: '18.0'

      - name: Setup CUDA 13.4
        uses: mjun0812/setup-cuda@v1
        with:
          version: '13.4'
          method: 'auto'

      - name: Setup vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE
          echo "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_BINARY_CACHE,readwrite" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-windows-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-

      - name: Bootstrap vcpkg and install dependencies
        shell: pwsh
        run: |
          # КРИТИЧНО: переопределяем VCPKG_ROOT, который перезаписывает msvc-dev-cmd
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"

          if (Test-Path $env:VCPKG_ROOT) {
            Remove-Item -Recurse -Force $env:VCPKG_ROOT
          }

          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            ffmpeg:x64-windows `
            curl:x64-windows `
            libjpeg-turbo:x64-windows `
            --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"

          cmake -S . -B $env:BUILD_DIR -G "Ninja Multi-Config" `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe" `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET `
            -DCMAKE_PREFIX_PATH="$env:VCPKG_ROOT\installed\x64-windows" `
            -DCMAKE_CUDA_ARCHITECTURES=120a `
            -DINFERNIX_BUILD_APPS=ON `
            -DBUILD_TESTING=ON

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir $env:BUILD_DIR -C Release --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: infernix-windows-release
          path: |
            ${{ env.BUILD_DIR }}\apps\Release\
            ${{ env.BUILD_DIR }}\bin\Release\
          if-no-files-found: error
