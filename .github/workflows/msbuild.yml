name: Build Infernix (Windows, CUDA 13.4, sm_120a)

on:
  workflow_dispatch: # Позволяет запускать сборку вручную со страницы Actions

jobs:
  build:
    name: Build and Package on Windows
    runs-on: windows-2022 # Стабильный образ с Visual Studio 2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CUDA Toolkit 13.4
        uses: mjun0812/setup-cuda@v1
        with:
          version: '13.4.0' # Указываем точную версию CUDA
          method: 'auto'    # 'auto' попробует network, затем local

      - name: Configure CMake
        # Infernix использует пресет "release". Явно задаем архитектуру 120a.
        run: cmake --preset release -DCMAKE_CUDA_ARCHITECTURES="120a"

      - name: Build with CMake
        # Собираем проект. Флаг -j использует все доступные ядра.
        run: cmake --build build --config Release -j

      - name: Package Release ZIP (PowerShell)
        shell: pwsh
        run: |
          # Сначала найдём, где лежат исполняемые файлы
          $exePath = Get-ChildItem -Path .\build -Filter "infernix-*.exe" -Recurse | Select-Object -First 1
          if (-not $exePath) {
            Write-Error "Исполняемые файлы Infernix не найдены в директории build/"
            exit 1
          }
          $sourceDir = $exePath.DirectoryName
          Write-Host "Упаковка файлов из: $sourceDir"
          Compress-Archive -Path "$sourceDir\*" -DestinationPath .\infernix-windows-cuda-sm120a.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: infernix-windows-cuda-sm120a
          path: .\infernix-windows-cuda-sm120a.zip
