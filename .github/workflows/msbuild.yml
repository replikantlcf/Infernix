name: Build Infernix (Windows, CUDA 13.1, sm_120a)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Package on Windows
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг для гарантии наличия CMake 3.28+
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x' # Устанавливаем минимально требуемую версию

      - name: Setup CUDA Toolkit 13.1
        uses: mjun0812/setup-cuda@v1
        with:
          version: '13.1.0' # Используем проверенную версию из документации
          method: 'auto'

      - name: Configure CMake
        run: cmake --preset release -DCMAKE_CUDA_ARCHITECTURES="120a"

      - name: Build with CMake
        # Убрали --config Release, так как он может дублировать настройки пресета
        run: cmake --build build -j

      - name: Package Release ZIP (PowerShell)
        shell: pwsh
        run: |
          # Сначала найдём, где лежат исполняемые файлы
          $exePath = Get-ChildItem -Path .\build -Filter "infernix-*.exe" -Recurse | Select-Object -First 1
          if (-not $exePath) {
            Write-Error "Исполняемые файлы Infernix не найдены в директории build/"
            exit 1
          }
          $sourceDir = $exePath.DirectoryName
          Write-Host "Упаковка файлов из: $sourceDir"
          Compress-Archive -Path "$sourceDir\*" -DestinationPath .\infernix-windows-cuda-sm120a.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: infernix-windows-cuda-sm120a
          path: .\infernix-windows-cuda-sm120a.zip
