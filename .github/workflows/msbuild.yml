name: Build Infernix (Windows, CUDA 13.1, sm_120a)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Package on Windows
    runs-on: windows-2022
    timeout-minutes: 180   # vcpkg install ffmpeg может занять много времени

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_TARGET_TRIPLET: x64-windows
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-cache,readwrite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Активируем окружение MSVC (cl.exe в PATH)
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2. Гарантируем наличие CMake 3.28+
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      # 3. Устанавливаем CUDA 13.1 (проверенная версия для Infernix)
      - name: Setup CUDA Toolkit 13.1
        uses: mjun0812/setup-cuda@v1
        with:
          version: '13.1.0'
          method: 'auto'

      # 4. Кэш vcpkg-бинарников — сильно ускоряет повторные сборки
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-windows-ffmpeg-curl-libjpeg-turbo-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-

      # 5. Клонируем vcpkg и устанавливаем зависимости
      - name: Setup vcpkg and Dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\.git)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg install ffmpeg:x64-windows curl:x64-windows libjpeg-turbo:x64-windows

      # 6. Конфигурируем CMake
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build-windows -G "Ninja Multi-Config" `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCMAKE_CUDA_COMPILER="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v13.1/bin/nvcc.exe" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="C:/vcpkg/installed/x64-windows" `
            -DCMAKE_CUDA_ARCHITECTURES=120a `
            -DINFERNIX_BUILD_APPS=ON `
            -DBUILD_TESTING=ON

      # 7. Собираем проект
      - name: Build with CMake
        shell: pwsh
        run: cmake --build build-windows --config Release

      # 8. Упаковываем результат в ZIP
      - name: Package Release ZIP
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path .\build-windows -Filter "infernix-*.exe" -Recurse | Select-Object -First 1
          if (-not $exePath) {
            Write-Error "Исполняемые файлы Infernix не найдены в директории build-windows/"
            Get-ChildItem -Path .\build-windows -Recurse -Filter "*.exe" | Select-Object FullName
            exit 1
          }
          $sourceDir = $exePath.DirectoryName
          Write-Host "Упаковка файлов из: $sourceDir"

          # Копируем DLL из vcpkg рядом с exe, чтобы архив был самодостаточным
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem -Path $vcpkgBin -Filter "*.dll" | Copy-Item -Destination $sourceDir -Force
          }

          Compress-Archive -Path "$sourceDir\*" -DestinationPath .\infernix-windows-cuda-sm120a.zip -Force

      # 9. Загружаем артефакт
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: infernix-windows-cuda-sm120a
          path: .\infernix-windows-cuda-sm120a.zip
