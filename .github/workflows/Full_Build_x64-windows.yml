name: Full Build for Windows_x64 (MSVC latest + CUDA 13.4) with remove unwanted executables!

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_TARGET_TRIPLET: x64-windows
  CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.4"
  BUILD_DIR: build-windows
  VCPKG_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
  VCPKG_PACKAGES: "ffmpeg curl libjpeg-turbo"

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSVC (Visual Studio 2026)
        uses: mlocati/setup-msvc@v1
        with:
          vs-version: latest
          architecture: x64
          
      - name: Verify MSVC in PATH
        shell: pwsh
        run: |
          where.exe cl
          cl 2>&1 | Select-Object -First 1

      - name: Setup CUDA 13.4
        uses: mjun0812/setup-cuda@v1
        with:
          version: '13.4'
          method: 'auto'

      - name: Setup vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE
          echo "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_BINARY_CACHE,readwrite" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-windows-${{ env.VCPKG_PACKAGES }}-${{ hashFiles('**/vcpkg.json', '**/CMakeLists.txt', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-

      - name: Bootstrap vcpkg and install dependencies
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"

          if (Test-Path $env:VCPKG_ROOT) {
            Remove-Item -Recurse -Force $env:VCPKG_ROOT
          }

          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            ffmpeg:x64-windows `
            curl:x64-windows `
            libjpeg-turbo:x64-windows `
            --triplet x64-windows

#####
      - name: Fix zlib library name mismatch (z.lib vs zlib.lib)
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg"
          $installedDir = Join-Path $vcpkgRoot "installed\x64-windows"
          $libDir = Join-Path $installedDir "lib"

          Write-Host "Searching for zlib.lib under: $installedDir"

          # Ищем zlib.lib рекурсивно по всему дереву installed/x64-windows
          $zlibFile = Get-ChildItem -Path $installedDir -Recurse -Filter "zlib.lib" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($zlibFile) {
            $zlibPath = $zlibFile.FullName
            $targetPath = Join-Path $libDir "z.lib"
            Write-Host "Found zlib.lib at: $zlibPath"

            if (-not (Test-Path $targetPath)) {
              Copy-Item -Path $zlibPath -Destination $targetPath
              Write-Host "Copied to: $targetPath"
            } else {
              Write-Host "z.lib already exists at: $targetPath"
            }
          } else {
            Write-Host "zlib.lib NOT FOUND anywhere under $installedDir"
            Write-Host "Full contents of lib directory:"
            Get-ChildItem -Path $libDir -Recurse | Format-Table FullName, Length
            exit 1
          }
#####
      - name: Configure CMake
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"

          cmake -S . -B $env:BUILD_DIR -G "Ninja Multi-Config" `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe" `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET `
            -DCMAKE_PREFIX_PATH="$env:VCPKG_ROOT\installed\x64-windows" `
            -DCMAKE_CUDA_ARCHITECTURES=120a `
            -DINFERNIX_BUILD_APPS=ON `
            -DBUILD_TESTING=OFF

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR --config Release --parallel

      - name: Smoke test (infernix-serve.exe --help, with timeout)
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            $exe = Get-Item "$env:BUILD_DIR\apps\Release\infernix-serve.exe" -ErrorAction SilentlyContinue
            if (-not $exe) { throw "infernix-serve.exe not found in apps\Release" }
            Write-Host "Running: $($exe.FullName)"
            $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--help' `
                    -NoNewWindow -PassThru
            if (-not $proc.WaitForExit(60000)) {
              $proc.Kill()
              throw "Smoke test timed out"
            }
            if ($proc.ExitCode -ne 0) {
              throw "Smoke test failed with exit code $($proc.ExitCode)"
            }
            Write-Host "Smoke test passed"
          } catch {
            Write-Host "::warning::Smoke test failed: $_"
            throw
          }

##################################################################################
# Remove files: "infernix.exe", "infernix-certify.exe", "infernix-perplexity.exe"
      - name: Remove unwanted executables (safety net)
        continue-on-error: true
        shell: pwsh
        run: |
          $appsDir = "$env:BUILD_DIR\apps\Release"
          $toRemove = @("infernix.exe", "infernix-certify.exe", "infernix-perplexity.exe")
          foreach ($file in $toRemove) {
            $path = Join-Path $appsDir $file
            if (Test-Path $path) {
              Remove-Item $path -Force
              Write-Host "Removed $file"
            } else {
              Write-Host "File not found: $file"
            }
          }
##################################################################################

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: infernix-windows-release
          path: |
            ${{ env.BUILD_DIR }}\apps\Release\
            ${{ env.BUILD_DIR }}\bin\Release\
          if-no-files-found: error
